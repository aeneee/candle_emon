    <style>
        :root {
            --bg: #050607;
            --grid: rgba(255, 255, 255, 0.05);
            --text: #ece6da;
            --muted: rgba(236, 230, 218, 0.4);
            --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            font-family: "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 76px 76px;
            background-position: center top;
        }

        .scene {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 0 16px 14vh;
            text-align: center;
            pointer-events: none;
        }

        .scene h1 {
            font-family: "Funnel Display", "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
            font-weight: 800;
            font-size: clamp(40px, 7vw, 96px);
            letter-spacing: -0.035em;
            line-height: 0.98;
        }

        .scene h1 em {
            font-style: normal;
            color: #f3c98f;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            font: 12px/1 var(--mono);
            color: var(--muted);
        }

        .hud>* {
            position: absolute;
            pointer-events: auto;
        }

        .tl {
            top: 18px;
            left: 20px;
            line-height: 1.8;
        }

        .tl a {
            color: var(--muted);
            text-decoration: none;
        }

        .tl a:hover {
            color: var(--text);
        }

        .pills {
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
        }

        .tr {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            color: var(--muted);
            font: inherit;
            padding: 7px 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tr:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .tr svg {
            width: 12px;
            height: 12px;
        }

        .tr.on {
            color: #f3c98f;
            border-color: rgba(243, 201, 143, 0.4);
        }

        .hint {
            left: 0;
            right: 0;
            bottom: 22px;
            text-align: center;
            pointer-events: none;
            padding: 0 16px;
        }

        .reset {
            left: 50%;
            bottom: 52px;
            transform: translateX(-50%);
            background: #ece6da;
            color: #111;
            border: 0;
            border-radius: 999px;
            font: 500 13px/1 var(--mono);
            padding: 11px 18px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            animation: rise 0.4s cubic-bezier(.2, .9, .3, 1.2);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translate(-50%, 12px);
            }
        }

        @media (max-width: 600px) {
            .scene {
                padding-bottom: 22vh;
            }
            .hint .wide {
                display: none;
            }
        }

<body>
    <div class="grid"></div>
    <main class="scene">
        <h1>Light <em>it</em>.</h1>
        <br>
        <p class="made-by">Made By <span>Ariyan Ahmed Emon</span></p>
    </main>
    <canvas id="c"></canvas>
    <div class="hud">
        <div class="pills">
            <button id="mic" class="tr" type="button" aria-label="Blow into the microphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>mic</span></button>
            <button id="sound" class="tr" type="button">sound: on</button>
        </div>
        <button id="fresh" class="reset" type="button" hidden>new candle</button>
        <div class="hint">pull a match · strike it fast across the strip · light the wick<span class="wide"> · swipe past to blow it out</span></div>
    </div>

    <script>
        const TAU = Math.PI * 2;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (a, b) => a + Math.random() * (b - a);
        const mix = (c1, c2, t) => c1.map((v, i) => Math.round(lerp(v, c2[i], t)));
        const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
        const smooth = (a, b, v) => {
            const t = clamp((v - a) / (b - a), 0, 1);
            return t * t * (3 - 2 * t);
        };

        const STEP = 1 / 240;
        const REF_W = 1440;
        const REF_H = 900;
        const LIGHT_SCALE = 0.25;
        const AMBIENT = 0.9;
        const ML = 70;
        const GRIP_S = 56;
        const HEAD_S = 3;
        const BURN_S = 50;
        const BURN_TIME = 15;
        const BASE_A = 0.95;
        const FIZZ_V = 380;
        const LIGHT_V = 600;
        const SNAP_V = 2800;
        const CANDLE_U = 200;
        const MIN_U = 40;
        const MELT = 0.45;
        const GUTTER = 550;
        const MAX_LYING = 12;

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const glow = document.createElement('canvas');
        const gctx = glow.getContext('2d');
        const dark = document.createElement('canvas');
        const dctx = dark.getContext('2d');
        const lamp = document.createElement('canvas');
        const tctx = lamp.getContext('2d');
        const soundBtn = document.getElementById('sound');
        const micBtn = document.getElementById('mic');
        const freshBtn = document.getElementById('fresh');

        let W = 0,
            H = 0,
            DPR = 1,
            VIEW = 1,
            S = 1;
        let time = 0;
        let surfaceY = 0;

        const candle = {
            x: 0,
            baseY: 0,
            w: 0,
            hu: CANDLE_U,
            lit: false,
            I: 0,
            health: 1,
            litT: 0,
            dying: 0,
            ember: 0,
            catchT: 0,
            lx: 0,
            ly: 0,
            lvx: 0,
            lvy: 0,
            flick: 1,
            flickV: 0,
            gut: 0,
            pool: 0,
            drips: [],
            dripT: 5,
            used: false,
        };
        const box = {
            x0: 0,
            x1: 0,
            y0: 0,
            y1: 0,
            d: 0,
            sk: 0,
            ext: 0,
            ox: 0,
            ov: 0,
            streaks: [],
            grain: [],
            heads: []
        };
        const mouse = {
            x: -999,
            y: -999,
            sx: -999,
            sy: -999,
            vx: 0,
            vy: 0,
            active: false
        };
        const air = {
            x: 0,
            y: 0
        };
        let grab = null;
        let matches = [];
        let sparks = [];
        let smoke = [];

        for (let i = 0; i < 360; i++) {
            box.grain.push({
                u: Math.random(),
                v: Math.random(),
                r: rand(0.35, 1.05),
                l: Math.random()
            });
        }
        for (let i = 0; i < 8; i++) {
            box.heads.push({
                v: 0.12 + i * 0.105,
                j: rand(-1.2, 1.2),
                c: rand(0, 1)
            });
        }

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            VIEW = Math.max(1, Math.min(window.innerWidth / REF_W, window.innerHeight / REF_H));
            W = window.innerWidth / VIEW;
            H = window.innerHeight / VIEW;
            canvas.width = Math.round(window.innerWidth * DPR);
            canvas.height = Math.round(window.innerHeight * DPR);
            glow.width = dark.width = lamp.width = Math.ceil(W * LIGHT_SCALE);
            glow.height = dark.height = lamp.height = Math.ceil(H * LIGHT_SCALE);
            S = clamp(Math.min(W / 1100, H / 820), 0.74, 1.05);
            const narrow = W < 640;
            surfaceY = H * (narrow ? 0.6 : 0.63);
            candle.x = W / 2 - (narrow ? 88 : 120) * S;
            candle.baseY = surfaceY;
            candle.w = 50 * S;
            const bw = 146 * S;
            const cx = W / 2 + (narrow ? 104 : 150) * S;
            box.x0 = cx - bw / 2;
            box.x1 = cx + bw / 2;
            box.y1 = surfaceY + 2 * S;
            box.y0 = box.y1 - 26 * S;
            box.d = 34 * S;
            box.sk = 14 * S;
            box.ext = 36 * S;
        }

        /* ---------- geometry ---------- */

        function candleTop() {
            return candle.baseY - 4 * S - candle.hu * S;
        }

        function wickTip() {
            const lean = candle.lit ? candle.lx * 2.5 * S : 0;
            return {
                x: candle.x + 1.2 * S + lean,
                y: candleTop() - 12 * S
            };
        }

        function flameBase() {
            const t = wickTip();
            return {
                x: t.x,
                y: t.y + 6 * S
            };
        }

        function mdir(m) {
            return {
                x: Math.cos(m.a),
                y: Math.sin(m.a)
            };
        }

        function mpos(m, s) {
            const d = mdir(m);
            const k = (s - (m.s0 + m.s1) / 2) * S;
            return {
                x: m.x + d.x * k,
                y: m.y + d.y * k
            };
        }

        function frontS(m) {
            if (m.state === 'unlit') {
                return m.s0;
            }
            if (m.state === 'flare') {
                return HEAD_S;
            }
            return HEAD_S + m.b * BURN_S;
        }

        function flamePos(m) {
            return mpos(m, m.state === 'flare' ? 2 : Math.max(frontS(m), m.s0));
        }

        function burning(m) {
            return m.state === 'flare' || m.state === 'lit';
        }

        function flareK(m) {
            if (m.state !== 'flare') {
                return 0;
            }
            const t = m.fireT;
            return t < 0.04 ? t / 0.04 : Math.exp(-(t - 0.04) * 6);
        }

        function floorAt(x, y) {
            if (x > box.x0 - box.ext && x < box.x1 + box.sk && y < box.y0 - box.d * 0.5 + 2) {
                return box.y0 - box.d * 0.45;
            }
            if (y < surfaceY + 30 * S) {
                return surfaceY + 8 * S;
            }
            return H - 6;
        }

        function stripHit(x, y) {
            const pad = 3 * S;
            return x > box.x0 + box.ox - pad && x < box.x1 + box.ox + pad && y > box.y0 - pad && y < box.y1 + pad;
        }

        function overBox(x, y) {
            return x > box.x0 - box.ext + box.ox && x < box.x1 + box.sk + box.ox && y > box.y0 - box.d - 8 * S && y < box.y1 + 6 * S;
        }

        function newMatch() {
            return {
                x: 0,
                y: 0,
                a: BASE_A,
                av: 0,
                s0: 0,
                s1: ML,
                head: true,
                state: 'unlit',
                b: 0,
                fl: 0,
                fireT: 0,
                vx: 0,
                vy: 0,
                va: 0,
                held: false,
                life: 1,
                age: 0,
                px: 0,
                py: 0,
                fresh: true,
                hv: 0,
                hvx: 0,
                hvy: 0,
                stroke: null,
                scratchT: 0,
                shakeT: 0,
                catchT: 0,
                lx: 0,
                ly: 0,
                lvx: 0,
                lvy: 0,
                ember: 0,
            };
        }

        /* ---------- sound ---------- */

        let ac = null;
        let noise = null;
        let muted = false;
        let loops = null;

        function audio() {
            if (ac) {
                return ac;
            }
            try {
                ac = new(window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                return null;
            }
            noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
            const d = noise.getChannelData(0);
            for (let i = 0; i < d.length; i++) {
                d[i] = Math.random() * 2 - 1;
            }
            return ac;
        }

        function ready() {
            return !muted && ac && ac.state === 'running';
        }

        function burst(t, dur, type, freq, gain, q = 1) {
            const s = ac.createBufferSource();
            s.buffer = noise;
            const f = ac.createBiquadFilter();
            f.type = type;
            f.frequency.value = freq;
            f.Q.value = q;
            const g = ac.createGain();
            g.gain.setValueAtTime(gain, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            s.connect(f).connect(g).connect(ac.destination);
            s.start(t, Math.random());
            s.stop(t + dur + 0.02);
        }

        function tone(t, f0, f1, dur, gain, type = 'sine') {
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = type;
            o.frequency.setValueAtTime(f0, t);
            o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(ac.destination);
            o.start(t);
            o.stop(t + dur + 0.02);
        }

        function sweep(t, dur, f0, f1, f2, gain, q = 1.2) {
            const s = ac.createBufferSource();
            s.buffer = noise;
            const f = ac.createBiquadFilter();
            f.type = 'bandpass';
            f.Q.value = q;
            f.frequency.setValueAtTime(f0, t);
            f.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.35);
            f.frequency.exponentialRampToValueAtTime(f2, t + dur);
            const g = ac.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.3);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            s.connect(f).connect(g).connect(ac.destination);
            s.start(t, Math.random());
            s.stop(t + dur + 0.02);
        }

        function sfx(name, amt = 1) {
            if (!ready()) {
                return;
            }
            const t = ac.currentTime + 0.005;
            if (name === 'scratch') {
                burst(t, 0.035, 'bandpass', rand(2400, 4200), 0.03 + 0.16 * amt, 1.3);
                burst(t, 0.015, 'highpass', 5200, 0.04 * amt);
                return;
            }
            if (name === 'fizz') {
                burst(t, 0.02, 'highpass', 3200, 0.2);
                sweep(t, 0.18, 1800, 3200, 1500, 0.07, 0.8);
                for (let i = 0; i < 5; i++) {
                    burst(t + Math.random() * 0.12, rand(0.004, 0.01), 'highpass', rand(2500, 6000), rand(0.05, 0.12));
                }
                return;
            }
            if (name === 'strike') {
                burst(t, 0.018, 'highpass', 3000, 0.5);
                burst(t + 0.005, 0.05, 'bandpass', 1400, 0.25, 1.2);
                tone(t, 140, 60, 0.12, 0.12);
                sweep(t + 0.01, 0.6, 700, 2600, 900, 0.34, 0.6);
                for (let i = 0; i < 18; i++) {
                    burst(t + 0.02 + Math.random() * 0.5, rand(0.004, 0.012), 'highpass', rand(2500, 6500), rand(0.05, 0.18));
                }
                sweep(t + 0.35, 0.9, 300, 700, 380, 0.05, 0.5);
                return;
            }
            if (name === 'relight') {
                sweep(t, 0.4, 600, 2000, 800, 0.2, 0.6);
                for (let i = 0; i < 8; i++) {
                    burst(t + 0.02 + Math.random() * 0.3, rand(0.004, 0.01), 'highpass', rand(2500, 6000), rand(0.04, 0.12));
                }
                return;
            }
            if (name === 'snap') {
                burst(t, 0.012, 'highpass', 2500, 0.6);
                tone(t, 1600, 700, 0.035, 0.18, 'triangle');
                burst(t + 0.004, 0.04, 'bandpass', 900, 0.35, 2);
                tone(t, 220, 120, 0.06, 0.15);
                for (let i = 0; i < 4; i++) {
                    burst(t + 0.01 + Math.random() * 0.04, 0.008, 'highpass', rand(3000, 6000), 0.1);
                }
                return;
            }
            if (name === 'tap') {
                burst(t, 0.02, 'bandpass', rand(1800, 2600), 0.05 + 0.2 * amt, 3);
                tone(t, rand(700, 900), 500, 0.04, 0.02 + 0.06 * amt, 'triangle');
                return;
            }
            if (name === 'slide') {
                sweep(t, 0.16, 800, 1800, 1200, 0.07, 0.9);
                burst(t + 0.14, 0.012, 'bandpass', 2400, 0.08, 3);
                return;
            }
            if (name === 'catch') {
                sweep(t, 0.8, 160, 480, 220, 0.24, 0.6);
                tone(t, 90, 130, 0.5, 0.05);
                for (let i = 0; i < 5; i++) {
                    burst(t + 0.05 + Math.random() * 0.4, rand(0.004, 0.01), 'highpass', rand(2000, 5000), rand(0.03, 0.08));
                }
                return;
            }
            if (name === 'blow') {
                sweep(t, 0.6, 240, 800, 200, 0.36, 0.5);
                burst(t, 0.3, 'lowpass', 300, 0.22);
                return;
            }
            if (name === 'puff') {
                sweep(t, 0.3, 400, 1000, 300, 0.1 * amt + 0.03, 0.6);
                return;
            }
            if (name === 'crackle') {
                burst(t, rand(0.004, 0.01), 'highpass', rand(2000, 5000), 0.02 + 0.07 * amt);
                return;
            }
            if (name === 'sputter') {
                burst(t, 0.03, 'bandpass', rand(500, 1200), 0.1 * amt, 1.5);
                burst(t, 0.006, 'highpass', 3000, 0.05 * amt);
                return;
            }
            if (name === 'click') {
                burst(t, 0.012, 'highpass', 2800, 0.25);
                tone(t, 1200, 900, 0.03, 0.05, 'triangle');
            }
        }

        function loopsStart() {
            if (loops || !ac) {
                return;
            }
            const mk = (type, freq, q) => {
                const n = ac.createBufferSource();
                n.buffer = noise;
                n.loop = true;
                const f = ac.createBiquadFilter();
                f.type = type;
                f.frequency.value = freq;
                f.Q.value = q;
                const g = ac.createGain();
                g.gain.value = 0.0001;
                n.connect(f).connect(g).connect(ac.destination);
                n.start();
                return {
                    g,
                    f
                };
            };
            loops = {
                hiss: mk('bandpass', 2600, 0.7),
                flutter: mk('lowpass', 260, 0.7)
            };
        }

        function loopsUpdate() {
            if (!ac || ac.state !== 'running') {
                return;
            }
            loopsStart();
            let hiss = 0;
            for (const m of matches) {
                if (m.state === 'flare') {
                    hiss += 0.06 * flareK(m) + 0.02;
                }
                if (m.state === 'lit') {
                    hiss += 0.012 * m.fl;
                }
            }
            const flutter = candle.lit ? 0.006 + 0.14 * candle.gut : 0;
            const t = ac.currentTime;
            loops.hiss.g.gain.setTargetAtTime(muted ? 0.0001 : Math.max(0.0001, Math.min(0.08, hiss)), t, 0.05);
            loops.flutter.g.gain.setTargetAtTime(muted ? 0.0001 : Math.max(0.0001, flutter), t, 0.06);
            loops.flutter.f.frequency.setTargetAtTime(200 + 500 * candle.gut, t, 0.08);
        }

        /* ---------- microphone ---------- */

        let mic = null;

        async function toggleMic() {
            if (mic) {
                mic.stream.getTracks().forEach((tr) => tr.stop());
                mic = null;
                micBtn.classList.remove('on');
                micBtn.querySelector('span').textContent = 'mic';
                return;
            }
            const a = audio();
            if (!a || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                micBtn.querySelector('span').textContent = 'no mic';
                return;
            }
            if (a.state === 'suspended') {
                a.resume();
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                const an = ac.createAnalyser();
                an.fftSize = 1024;
                ac.createMediaStreamSource(stream).connect(an);
                mic = {
                    stream,
                    an,
                    buf: new Float32Array(an.fftSize),
                    rms: 0,
                    blow: 0,
                    dir: 1,
                    dirT: 0
                };
                micBtn.classList.add('on');
                micBtn.querySelector('span').textContent = 'mic: on';
            } catch (e) {
                micBtn.querySelector('span').textContent = 'mic: blocked';
            }
        }

        function readMic(dt) {
            if (!mic) {
                return;
            }
            mic.an.getFloatTimeDomainData(mic.buf);
            let sum = 0;
            for (let i = 0; i < mic.buf.length; i++) {
                sum += mic.buf[i] * mic.buf[i];
            }
            const rms = Math.sqrt(sum / mic.buf.length);
            mic.rms = lerp(mic.rms, rms, 1 - Math.exp(-(rms > mic.rms ? 25 : 6) * dt));
            mic.blow = clamp((mic.rms - 0.05) / 0.18, 0, 1);
            mic.dirT -= dt;
            if (mic.dirT <= 0) {
                mic.dir = Math.random() < 0.5 ? -1 : 1;
                mic.dirT = rand(0.4, 1.2);
            }
        }

        /* ---------- actions ---------- */

        function spark(x, y, vx, vy, life, kind = 'fire') {
            sparks.push({
                x,
                y,
                vx,
                vy,
                life,
                max: life,
                kind,
                a: rand(0, TAU),
                va: rand(-20, 20)
            });
        }

        function emitSmoke(src, dur, str, puff = false) {
            smoke.push({
                src,
                dur,
                str,
                puff,
                t: 0,
                acc: 0,
                pts: [],
                seed: rand(0, TAU)
            });
        }

        function addStreak(st, strong) {
            const bw = box.x1 - box.x0;
            const fh = box.y1 - box.y0;
            box.streaks.push({
                u0: clamp((st.sx - box.x0) / bw, 0, 1),
                v0: clamp((st.sy - box.y0) / fh, 0.1, 0.9),
                u1: clamp((st.ex - box.x0) / bw, 0, 1),
                v1: clamp((st.ey - box.y0) / fh, 0.1, 0.9),
                a: strong ? 0.5 : 0.25,
            });
            box.streaks = box.streaks.slice(-14);
        }

        function ignite(m, struck) {
            m.state = 'flare';
            m.fireT = 0;
            m.fl = 0.5;
            m.b = 0;
            const h = mpos(m, 1);
            const n = struck ? 26 : 12;
            for (let i = 0; i < n; i++) {
                const a = rand(0, TAU);
                const sp = rand(60, 360) * S;
                spark(h.x, h.y, Math.cos(a) * sp + m.hvx * 0.25, Math.sin(a) * sp - 80 * S + m.hvy * 0.2, rand(0.2, 0.6));
            }
            emitSmoke(() => mpos(m, 1), 0.35, 0.9, true);
            if (struck) {
                box.ov += Math.sign(m.hvx || 1) * 40 * S;
                sfx('strike');
                return;
            }
            sfx('relight');
        }

        function fizzle(m) {
            const h = mpos(m, 1);
            for (let i = 0; i < 7; i++) {
                spark(h.x, h.y, m.hvx * 0.3 + rand(-120, 120) * S, rand(-220, -40) * S, rand(0.12, 0.35));
            }
            box.ov += Math.sign(m.hvx || 1) * 15 * S;
            sfx('fizz');
        }

        function snap(m) {
            const cut = rand(26, 33);
            const piece = newMatch();
            piece.s0 = 0;
            piece.s1 = cut;
            piece.a = m.a;
            const c = mpos(m, cut / 2);
            piece.x = c.x;
            piece.y = c.y;
            piece.fresh = false;
            piece.vx = m.hvx * 0.35 + rand(-60, 60) * S;
            piece.vy = m.hvy * 0.25 - rand(260, 420) * S;
            piece.va = rand(14, 26) * (Math.random() < 0.5 ? -1 : 1);
            const b = mpos(m, cut);
            m.s0 = cut;
            m.head = false;
            m.av += rand(-10, 10);
            m.stroke = null;
            matches.push(piece);
            for (let i = 0; i < 9; i++) {
                spark(b.x, b.y, rand(-160, 160) * S + m.hvx * 0.15, rand(-300, -60) * S, rand(0.6, 1.2), 'wood');
            }
            box.ov += Math.sign(m.hvx || 1) * 60 * S;
            sfx('snap');
        }

        function douse(m, loud) {
            m.state = 'out';
            m.ember = 1;
            const s = frontS(m);
            emitSmoke(() => mpos(m, s), loud ? 1.6 : 2.4, 0.6);
            sfx('puff', loud ? 1 : 0.4);
        }

        function lightCandle() {
            candle.lit = true;
            candle.used = true;
            candle.I = 0.12;
            candle.health = 1;
            candle.litT = 0;
            candle.ember = 0;
            candle.catchT = 0;
            candle.lx = 0;
            candle.lvx = 0;
            sfx('catch');
        }

        function blowOut() {
            candle.lit = false;
            candle.dying = 0.16;
            candle.ember = 1;
            candle.health = 1;
            emitSmoke(() => wickTip(), 4.2, 1);
            sfx('blow');
        }

        function freshCandle() {
            candle.hu = CANDLE_U;
            candle.lit = false;
            candle.used = false;
            candle.drips = [];
            candle.pool = 0;
            candle.ember = 0;
            candle.dying = 0;
            candle.I = 0;
            matches = matches.filter((m) => m.held);
            sparks = [];
            smoke = [];
            box.streaks = [];
            sfx('slide');
            syncUI();
        }

        function spawnDrip() {
            const side = Math.random() < 0.5 ? -1 : 1;
            const u = Math.random() < 0.55 ? side * rand(0.55, 0.96) : rand(-0.5, 0.5);
            candle.drips.push({
                u,
                top: candle.hu + 1,
                L: 0,
                max: rand(16, 80),
                v: rand(12, 22),
                w: rand(3.6, 6.2)
            });
            candle.drips = candle.drips.slice(-16);
        }

        /* ---------- ui ---------- */

        let freshShown = false;

        function syncUI() {
            const show = !candle.lit && candle.hu < CANDLE_U - 18;
            if (show === freshShown) {
                return;
            }
            freshShown = show;
            freshBtn.hidden = !show;
        }

        /* ---------- simulation ---------- */

        function stepMouse(dt) {
            const k = 1 - Math.exp(-120 * dt);
            const nx = mouse.sx + (mouse.x - mouse.sx) * k;
            const ny = mouse.sy + (mouse.y - mouse.sy) * k;
            const j = 1 - Math.exp(-30 * dt);
            mouse.vx = lerp(mouse.vx, (nx - mouse.sx) / dt, j);
            mouse.vy = lerp(mouse.vy, (ny - mouse.sy) / dt, j);
            mouse.sx = nx;
            mouse.sy = ny;
        }

        function stepHeld(m, dt) {
            const aT = clamp(BASE_A - mouse.vx * 0.00024, 0.2, 1.8);
            m.av += ((aT - m.a) * 170 - m.av * 15) * dt;
            m.a += m.av * dt;
            const d = mdir(m);
            const k = (GRIP_S - (m.s0 + m.s1) / 2) * S;
            m.x = mouse.sx - d.x * k;
            m.y = mouse.sy - d.y * k;
        }

        function stepFree(m, dt) {
            m.vy += 1500 * S * dt;
            m.x += m.vx * dt;
            m.y += m.vy * dt;
            m.a += m.va * dt;
            const d = mdir(m);
            const half = ((m.s1 - m.s0) * S) / 2;
            const floor = floorAt(m.x, m.y);
            const low = m.y + Math.abs(d.y) * half + 1.6 * S;
            if (low >= floor) {
                m.y -= low - floor;
                if (m.vy > 140 * S) {
                    sfx('tap', clamp(m.vy / (900 * S), 0.1, 1));
                    m.vy = -m.vy * 0.28;
                    m.va = m.va * 0.5 + rand(-6, 6);
                    m.vx *= 0.6;
                } else {
                    m.vy = 0;
                }
                const flat = Math.round(m.a / Math.PI) * Math.PI;
                m.a += (flat - m.a) * (1 - Math.exp(-12 * dt));
                m.va *= Math.exp(-10 * dt);
                m.vx *= Math.exp(-5 * dt);
            }
            if (m.x < 10 || m.x > W - 10) {
                m.x = clamp(m.x, 10, W - 10);
                m.vx *= -0.4;
            }
        }

        function trackMatch(m, dt) {
            const p = mpos(m, m.s0 + 2);
            if (m.fresh) {
                m.fresh = false;
                m.px = p.x;
                m.py = p.y;
                return;
            }
            const k = 1 - Math.exp(-60 * dt);
            m.hvx = lerp(m.hvx, (p.x - m.px) / dt, k);
            m.hvy = lerp(m.hvy, (p.y - m.py) / dt, k);
            m.hv = Math.hypot(m.hvx, m.hvy);
            m.px = p.x;
            m.py = p.y;
        }

        function strike(m, dt) {
            if (!m.held) {
                return;
            }
            if (!stripHit(m.px, m.py)) {
                if (m.stroke) {
                    settleStroke(m);
                    m.stroke = null;
                }
                return;
            }
            if (!m.stroke) {
                m.stroke = {
                    len: 0,
                    peak: 0,
                    sx: m.px,
                    sy: m.py,
                    ex: m.px,
                    ey: m.py,
                    done: false
                };
            }
            const st = m.stroke;
            st.len += m.hv * dt;
            st.peak = Math.max(st.peak, m.hv);
            st.ex = m.px;
            st.ey = m.py;
            m.scratchT -= dt;
            if (m.hv > 40 && m.scratchT <= 0) {
                sfx('scratch', clamp(m.hv / 1800, 0.05, 1));
                m.scratchT = 0.03;
                if (m.head && m.state === 'unlit' && m.hv > 250 && Math.random() < 0.3) {
                    spark(m.px, m.py, rand(-60, 60) * S, rand(-120, -20) * S, rand(0.08, 0.2));
                }
            }
            if (st.done) {
                return;
            }
            if (m.hv < 120) {
                st.len = 0;
                st.peak = 0;
                st.sx = m.px;
                st.sy = m.py;
                return;
            }
            if (st.len >= 44 * S && st.peak >= FIZZ_V) {
                settleStroke(m);
            }
        }

        function settleStroke(m) {
            const st = m.stroke;
            if (st.done) {
                return;
            }
            st.done = true;
            if (!m.head || m.state !== 'unlit' || st.len < 10 * S || st.peak < FIZZ_V) {
                return;
            }
            addStreak(st, st.peak >= LIGHT_V);
            if (st.peak >= SNAP_V) {
                snap(m);
                return;
            }
            if (st.peak >= LIGHT_V) {
                ignite(m, true);
                return;
            }
            fizzle(m);
        }

        function stepBurn(m, dt) {
            m.age += dt;
            m.ember = Math.max(0, m.ember - dt * 0.5);
            const tx = m.held ? clamp(-m.hvx * 0.0011, -1.5, 1.5) : 0;
            const ty = m.held ? clamp(-m.hvy * 0.0009, -0.6, 1.5) : 0;
            m.lvx += ((tx - m.lx) * 220 - m.lvx * 16) * dt;
            m.lvy += ((ty - m.ly) * 220 - m.lvy * 16) * dt;
            m.lx += m.lvx * dt;
            m.ly += m.lvy * dt;
            if (!burning(m)) {
                return;
            }
            m.fireT += dt;
            if (m.state === 'flare') {
                m.fl = lerp(m.fl, 1, 1 - Math.exp(-4 * dt));
                if (m.fireT >= 0.55) {
                    m.state = 'lit';
                }
                return;
            }
            const d = mdir(m);
            m.b += ((1 + 1.6 * Math.max(0, -d.y)) / BURN_TIME) * dt;
            const target = m.b > 0.86 ? clamp((1 - m.b) / 0.14, 0, 1) : 1;
            m.fl = lerp(m.fl, target, 1 - Math.exp(-4 * dt));
            if (m.b >= 1) {
                m.b = 1;
                douse(m, false);
                return;
            }
            m.shakeT = m.held && m.hv > 2300 ? m.shakeT + dt : Math.max(0, m.shakeT - dt * 2);
            if (m.shakeT > 0.1 && m.fireT > 0.9) {
                douse(m, true);
            }
        }

        function stepIgnition(dt) {
            const tip = wickTip();
            const fb = flameBase();
            let near = false;
            for (const m of matches) {
                if (burning(m) && m.fl > 0.35 && !candle.lit) {
                    const f = flamePos(m);
                    if (Math.hypot(f.x - tip.x, f.y - 7 * S - tip.y) < 17 * S) {
                        near = true;
                    }
                }
                if (m.state === 'unlit' && m.head && candle.lit && candle.I > 0.4) {
                    const h = mpos(m, 2);
                    const d = Math.hypot(h.x - (fb.x + candle.lx * 14 * S), h.y - (fb.y - 16 * S));
                    m.catchT = d < 16 * S ? m.catchT + dt : 0;
                    if (m.catchT > 0.25) {
                        ignite(m, false);
                    }
                }
            }
            candle.catchT = near ? candle.catchT + dt : Math.max(0, candle.catchT - dt);
            if (candle.catchT > 0.35 && !candle.lit && candle.hu > MIN_U) {
                lightCandle();
            }
        }

        function stepCandle(dt) {
            const fb = flameBase();
            const dx = mouse.sx - fb.x;
            const dy = mouse.sy - (fb.y - 20 * S);
            const R = 150 * S;
            const fall = mouse.active ? Math.exp(-(dx * dx + dy * dy) / (R * R)) : 0;
            let ix = mouse.vx * fall;
            let iy = mouse.vy * fall;
            if (mic && mic.blow > 0) {
                ix += mic.dir * mic.blow * 2400;
                iy -= mic.blow * 300;
            }
            const k = 1 - Math.exp(-(Math.hypot(ix, iy) > Math.hypot(air.x, air.y) ? 26 : 5) * dt);
            air.x += (ix - air.x) * k;
            air.y += (iy - air.y) * k;
            candle.dying = Math.max(0, candle.dying - dt);
            candle.ember = Math.max(0, candle.ember - dt * 0.4);
            for (const d of candle.drips) {
                if (d.L < d.max) {
                    d.v = Math.max(1, d.v * Math.exp(-0.5 * dt));
                    d.L = Math.min(d.max, d.L + d.v * dt * (candle.lit ? 1 : 0.4));
                }
            }
            if (!candle.lit) {
                candle.pool = Math.max(0, candle.pool - dt / 25);
                candle.I = Math.max(0, candle.I - dt * 6);
                candle.gut = 0;
                return;
            }
            candle.litT += dt;
            const g = Math.hypot(air.x, air.y);
            if (g > GUTTER) {
                candle.health -= ((g - GUTTER) / 300) * dt * 2;
            } else {
                candle.health = Math.min(1, candle.health + dt * 0.5);
            }
            candle.gut = clamp((g - 120) / 900, 0, 1);
            if (candle.health <= 0 || g > 1250) {
                blowOut();
                return;
            }
            const tx = clamp(air.x * 0.0011, -1.4, 1.4);
            const ty = clamp(air.y * 0.0009, -0.7, 1.2);
            if (Math.random() < dt * (2.5 + 30 * candle.gut)) {
                candle.lvx += rand(-1, 1) * (0.35 + 3 * candle.gut);
                candle.lvy += rand(-0.5, 0.5) * (0.2 + 2 * candle.gut);
            }
            candle.lvx += ((tx - candle.lx) * 90 - candle.lvx * 10) * dt;
            candle.lvy += ((ty - candle.ly) * 90 - candle.lvy * 10) * dt;
            candle.lx += candle.lvx * dt;
            candle.ly += candle.lvy * dt;
            if (Math.random() < dt * 6) {
                candle.flickV += rand(-1, 1) * (0.5 + 2 * candle.gut);
            }
            candle.flickV += ((1 - candle.flick) * 70 - candle.flickV * 7) * dt;
            candle.flick = clamp(candle.flick + candle.flickV * dt, 0.6, 1.3);
            const ramp = smooth(0, 1.6, candle.litT);
            const target = (0.18 + 0.82 * ramp) * (0.3 + 0.7 * candle.health);
            candle.I = lerp(candle.I, target, 1 - Math.exp(-6 * dt));
            candle.hu -= MELT * dt;
            candle.pool = Math.min(1, candle.pool + dt / 7);
            if (candle.pool > 0.5) {
                candle.dripT -= dt;
            }
            if (candle.dripT <= 0) {
                spawnDrip();
                candle.dripT = rand(6, 14);
            }
            if (candle.hu <= MIN_U) {
                candle.hu = MIN_U;
                candle.lit = false;
                candle.dying = 0.16;
                candle.ember = 1;
                emitSmoke(() => wickTip(), 3, 0.8);
                sfx('puff', 1);
            }
        }

        function step(dt) {
            stepMouse(dt);
            for (const m of matches) {
                if (m.held) {
                    stepHeld(m, dt);
                } else {
                    stepFree(m, dt);
                }
                trackMatch(m, dt);
                strike(m, dt);
                stepBurn(m, dt);
            }
            stepIgnition(dt);
            stepCandle(dt);
            box.ov += (-box.ox * 420 - box.ov * 16) * dt;
            box.ox += box.ov * dt;
        }

        function updateSmoke(dt) {
            const R2 = (80 * S) ** 2;
            for (const s of smoke) {
                s.t += dt;
                if (s.t < s.dur) {
                    s.acc += dt;
                    while (s.acc > 1 / 60) {
                        s.acc -= 1 / 60;
                        const p = s.src();
                        const f = 1 - s.t / s.dur;
                        s.pts.push({
                            x: p.x + (s.puff ? rand(-3, 3) * S : 0),
                            y: p.y,
                            vx: s.puff ? rand(-40, 40) * S : rand(-2, 2) * S,
                            vy: (s.puff ? rand(-70, -20) : -55) * S,
                            age: 0,
                            life: s.puff ? rand(1.2, 2) : rand(2.6, 3.6),
                            seed: s.puff ? rand(0, TAU) : s.seed + s.t * 0.8,
                            a: s.puff ? 1 : Math.pow(f, 0.6),
                        });
                    }
                }
                for (const p of s.pts) {
                    p.age += dt;
                    p.vy = Math.max(p.vy - 70 * S * dt, -95 * S);
                    const yy = p.y / S;
                    const curl = (Math.sin(yy * 0.034 + time * 1.1 + s.seed) * 150 + Math.sin(yy * 0.081 - time * 1.7 + s.seed * 2) * 70) * S;
                    p.vx += curl * smooth(0.15, 1.2, p.age) * dt;
                    p.vx *= Math.exp(-1.2 * dt);
                    const dx = p.x - mouse.sx;
                    const dy = p.y - mouse.sy;
                    const fall = mouse.active ? Math.exp(-(dx * dx + dy * dy) / R2) : 0;
                    if (fall > 0.01) {
                        const kk = Math.min(1, 7 * dt) * fall;
                        p.vx += (mouse.vx * 0.8 - p.vx) * kk;
                        p.vy += (mouse.vy * 0.8 - p.vy) * kk;
                    }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                }
                s.pts = s.pts.filter((p) => p.age < p.life);
            }
            smoke = smoke.filter((s) => s.t < s.dur || s.pts.length);
        }

        function updateSparks(dt) {
            for (const p of sparks) {
                p.life -= dt;
                p.vy += (p.kind === 'wood' ? 1500 : 700) * S * dt;
                p.vx *= Math.exp(-(p.kind === 'wood' ? 0.5 : 2) * dt);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.a += p.va * dt;
                const f = floorAt(p.x, p.y - 20);
                if (p.y > f) {
                    p.y = f;
                    p.vy *= -0.3;
                    p.vx *= 0.5;
                    p.va *= 0.3;
                    if (p.kind === 'fire') {
                        p.life = Math.min(p.life, 0.05);
                    }
                }
            }
            sparks = sparks.filter((p) => p.life > 0);
        }

        function updateWorld(dt) {
            time += dt;
            readMic(dt);
            updateSmoke(dt);
            updateSparks(dt);
            const lying = matches.filter((m) => !m.held);
            if (lying.length > MAX_LYING) {
                lying.slice(0, lying.length - MAX_LYING).forEach((m) => {
                    m.life = Math.min(m.life, 0.99);
                });
            }
            for (const m of matches) {
                if (m.life < 1) {
                    m.life -= dt * 0.8;
                }
                if (m.state === 'lit' && Math.random() < dt * 2.5) {
                    sfx('crackle', 0.4);
                }
            }
            matches = matches.filter((m) => m.life > 0 || m.held);
            if (candle.lit && Math.random() < dt * (0.15 + candle.gut * 6)) {
                sfx(candle.gut > 0.2 ? 'sputter' : 'crackle', 0.3 + candle.gut);
            }
            loopsUpdate();
            syncUI();
        }

        /* ---------- input ---------- */

        function capture(e) {
            try {
                canvas.setPointerCapture(e.pointerId);
            } catch (err) {
                return;
            }
        }

        function setMouse(e) {
            mouse.x = e.clientX / VIEW;
            mouse.y = e.clientY / VIEW;
            if (mouse.sx < -500) {
                mouse.sx = mouse.x;
                mouse.sy = mouse.y;
            }
        }

        function hitMatch(x, y) {
            for (let i = matches.length - 1; i >= 0; i--) {
                const m = matches[i];
                if (m.held || m.s1 < ML || m.life < 0.6) {
                    continue;
                }
                const a = mpos(m, m.s0);
                const b = mpos(m, m.s1);
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy || 1), 0, 1);
                if (Math.hypot(x - (a.x + dx * t), y - (a.y + dy * t)) < 14 * S) {
                    return m;
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            const a = audio();
            if (a && a.state === 'suspended') {
                a.resume();
            }
            if (grab) {
                return;
            }
            setMouse(e);
            mouse.sx = mouse.x;
            mouse.sy = mouse.y;
            mouse.vx = 0;
            mouse.vy = 0;
            mouse.active = true;
            const lyingMatch = hitMatch(mouse.x, mouse.y);
            if (lyingMatch) {
                lyingMatch.held = true;
                lyingMatch.vx = lyingMatch.vy = lyingMatch.va = 0;
                lyingMatch.av = 0;
                lyingMatch.fresh = true;
                lyingMatch.life = 1;
                matches.splice(matches.indexOf(lyingMatch), 1);
                matches.push(lyingMatch);
                grab = {
                    id: e.pointerId,
                    m: lyingMatch
                };
                capture(e);
                canvas.style.cursor = 'grabbing';
                sfx('tap', 0.2);
                return;
            }
            if (!overBox(mouse.x, mouse.y)) {
                return;
            }
            const m = newMatch();
            m.held = true;
            stepHeld(m, 0);
            matches.push(m);
            grab = {
                id: e.pointerId,
                m
            };
            box.ov -= 25 * S;
            capture(e);
            canvas.style.cursor = 'grabbing';
            sfx('slide');
        });

        canvas.addEventListener('pointermove', (e) => {
            if (grab && grab.id !== e.pointerId) {
                return;
            }
            if (e.pointerType !== 'mouse' && !grab && e.buttons === 0) {
                return;
            }
            setMouse(e);
            mouse.active = true;
            if (grab) {
                return;
            }
            const over = overBox(mouse.x, mouse.y) || hitMatch(mouse.x, mouse.y);
            canvas.style.cursor = over ? 'grab' : 'default';
        });

        function release(e) {
            if (e.pointerType !== 'mouse') {
                mouse.active = false;
            }
            if (!grab || grab.id !== e.pointerId) {
                return;
            }
            const m = grab.m;
            if (m.stroke) {
                settleStroke(m);
                m.stroke = null;
            }
            m.held = false;
            m.vx = mouse.vx * 0.5;
            m.vy = mouse.vy * 0.5;
            m.va = rand(-3, 3) + mouse.vx * 0.004;
            grab = null;
            canvas.style.cursor = 'default';
        }
        canvas.addEventListener('pointerup', release);
        canvas.addEventListener('pointercancel', release);
        canvas.addEventListener('pointerleave', (e) => {
            if (e.pointerType === 'mouse' && !grab) {
                mouse.active = false;
            }
        });

        soundBtn.addEventListener('click', () => {
            muted = !muted;
            soundBtn.textContent = muted ? 'sound: off' : 'sound: on';
            const a = audio();
            if (a && a.state === 'suspended') {
                a.resume();
            }
        });
        micBtn.addEventListener('click', () => {
            sfx('click');
            toggleMic();
        });
        freshBtn.addEventListener('click', freshCandle);
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'r' || freshBtn.hidden) {
                return;
            }
            freshCandle();
        });
        window.addEventListener('resize', resize);

        /* ---------- rendering: objects ---------- */

        function drawContactShadows() {
            const sh = (x, y, rx, ry, a) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, ry / rx);
                const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
                g.addColorStop(0, `rgba(0,0,0,${a})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
                ctx.restore();
            };
            sh(candle.x, candle.baseY + 4 * S, candle.w * 1.5, candle.w * 0.32, 0.7);
            const bx = (box.x0 - box.ext + box.x1 + box.sk) / 2 + box.ox;
            sh(bx, box.y1 - box.d * 0.3, (box.x1 - box.x0 + box.ext) * 0.7, box.d * 0.9, 0.6);
        }

        const WAX_STOPS = [
            [0, [128, 112, 94]],
            [0.16, [206, 192, 170]],
            [0.36, [246, 238, 222]],
            [0.52, [236, 226, 206]],
            [0.8, [190, 174, 150]],
            [1, [112, 97, 80]]
        ];

        function waxGradient(x, r) {
            const g = ctx.createLinearGradient(x - r, 0, x + r, 0);
            WAX_STOPS.forEach(([s, c]) => g.addColorStop(s, rgba(c, 1)));
            return g;
        }

        function drawCandle() {
            const x = candle.x;
            const r = candle.w / 2;
            const ry = candle.w * 0.15;
            const bottom = candle.baseY - 4 * S;
            const top = candleTop();
            const dr = candle.w * 0.98;
            const dry = dr * 0.22;
            const base = candle.baseY;
            ctx.fillStyle = '#3b2a14';
            ctx.beginPath();
            ctx.ellipse(x, base + 3 * S, dr, dry, 0, 0, TAU);
            ctx.fill();
            const brass = ctx.createLinearGradient(x - dr, 0, x + dr, 0);
            brass.addColorStop(0, '#5a4220');
            brass.addColorStop(0.3, '#c9a15a');
            brass.addColorStop(0.45, '#f1d9a0');
            brass.addColorStop(0.7, '#a07a3a');
            brass.addColorStop(1, '#4a3418');
            ctx.fillStyle = brass;
            ctx.beginPath();
            ctx.ellipse(x, base, dr, dry, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(40,28,12,0.55)';
            ctx.beginPath();
            ctx.ellipse(x, base - 0.8 * S, dr * 0.8, dry * 0.68, 0, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,236,190,0.35)';
            ctx.lineWidth = 0.8 * S;
            ctx.beginPath();
            ctx.ellipse(x, base, dr, dry, 0, Math.PI * 1.1, Math.PI * 1.7);
            ctx.stroke();

            const g = waxGradient(x, r);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(x - r, top);
            ctx.lineTo(x - r, bottom);
            ctx.ellipse(x, bottom, r, ry, 0, Math.PI, 0, true);
            ctx.lineTo(x + r, top);
            ctx.ellipse(x, top, r, ry, 0, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill();

            for (const d of candle.drips) {
                const t0 = Math.min(d.top, candle.hu);
                const len = d.L - (d.top - t0);
                if (len <= 0.5) {
                    continue;
                }
                const dx = x + d.u * r;
                const edge = Math.sqrt(Math.max(0, 1 - d.u * d.u));
                const y0 = candle.baseY - 4 * S - t0 * S + edge * ry - 1 * S;
                const y1 = Math.min(y0 + len * S, bottom + edge * ry - 2 * S);
                const w = d.w * S * (0.6 + 0.4 * edge);
                ctx.fillStyle = 'rgba(70,50,30,0.16)';
                ctx.beginPath();
                ctx.moveTo(dx - w * 0.7 + 1.2 * S, y0);
                ctx.quadraticCurveTo(dx - w * 0.5 + 1.2 * S, lerp(y0, y1, 0.5), dx - w * 0.45 + 1.2 * S, y1 - w * 0.6);
                ctx.arc(dx + 1.2 * S, y1 - w * 0.6 + 0.8 * S, w * 0.62, Math.PI, 0, true);
                ctx.quadraticCurveTo(dx + w * 0.5 + 1.2 * S, lerp(y0, y1, 0.5), dx + w * 0.7 + 1.2 * S, y0);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(dx - w * 0.7, y0 - 2 * S);
                ctx.quadraticCurveTo(dx - w * 0.5, lerp(y0, y1, 0.5), dx - w * 0.45, y1 - w * 0.6);
                ctx.arc(dx, y1 - w * 0.6, w * 0.62, Math.PI, 0, true);
                ctx.quadraticCurveTo(dx + w * 0.5, lerp(y0, y1, 0.5), dx + w * 0.7, y0 - 2 * S);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,252,244,0.55)';
                ctx.lineWidth = 0.9 * S;
                ctx.beginPath();
                ctx.moveTo(dx - w * 0.3, y0);
                ctx.lineTo(dx - w * 0.28, y1 - w * 0.6);
                ctx.stroke();
                ctx.fillStyle = 'rgba(60,40,20,0.12)';
                ctx.beginPath();
                ctx.ellipse(dx + w * 0.15, y1 + 0.2 * S, w * 0.6, w * 0.25, 0, 0, TAU);
                ctx.fill();
            }

            const tg = ctx.createLinearGradient(x - r, top - ry, x + r, top + ry);
            tg.addColorStop(0, '#fbf5e8');
            tg.addColorStop(1, '#cdbd9f');
            ctx.fillStyle = tg;
            ctx.beginPath();
            ctx.ellipse(x, top, r, ry, 0, 0, TAU);
            ctx.fill();
            const melted = candle.used ? 1 : 0;
            const pr = r * (0.62 + 0.2 * melted);
            const pry = ry * (0.6 + 0.2 * melted);
            ctx.fillStyle = `rgba(120,96,66,${0.22 + 0.1 * melted})`;
            ctx.beginPath();
            ctx.ellipse(x, top + ry * 0.12, pr, pry, 0, 0, TAU);
            ctx.fill();
            if (candle.pool > 0.01) {
                const pg = ctx.createRadialGradient(x, top + ry * 0.2, 0, x, top + ry * 0.2, pr);
                pg.addColorStop(0, `rgba(252,214,160,${0.9 * candle.pool})`);
                pg.addColorStop(1, `rgba(214,168,110,${0.8 * candle.pool})`);
                ctx.fillStyle = pg;
                ctx.beginPath();
                ctx.ellipse(x, top + ry * 0.14, pr * 0.94, pry * 0.9, 0, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = `rgba(255,255,245,${0.45 * candle.pool})`;
                ctx.lineWidth = 0.9 * S;
                ctx.beginPath();
                ctx.ellipse(x, top + ry * 0.14, pr * 0.8, pry * 0.7, 0, Math.PI * 1.15, Math.PI * 1.5);
                ctx.stroke();
            }
            drawWick(1);
        }

        function drawWick(alpha) {
            const top = candleTop();
            const t = wickTip();
            const x = candle.x;
            ctx.strokeStyle = `rgba(30,22,17,${alpha})`;
            ctx.lineWidth = 1.9 * S;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x, top + 1 * S);
            ctx.quadraticCurveTo(x - 0.6 * S, top - 7 * S, t.x, t.y);
            ctx.stroke();
            if (candle.used) {
                ctx.fillStyle = `rgba(14,10,8,${alpha})`;
                ctx.beginPath();
                ctx.arc(t.x, t.y + 0.6 * S, 1.5 * S, 0, TAU);
                ctx.fill();
            }
        }

        function boxPoly() {
            const o = box.ox;
            return [
                [box.x0 - box.ext + o, box.y1],
                [box.x0 - box.ext + o, box.y0],
                [box.x0 - box.ext + box.sk + o, box.y0 - box.d],
                [box.x1 + box.sk + o, box.y0 - box.d],
                [box.x1 + box.sk + o, box.y1 - box.d],
                [box.x1 + o, box.y1],
            ];
        }

        function quad(pts) {
            ctx.beginPath();
            pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
            ctx.closePath();
        }

        function drawBox() {
            ctx.save();
            ctx.translate(box.ox, 0);
            const {
                x0,
                x1,
                y0,
                y1,
                d,
                sk,
                ext
            } = box;
            const fh = y1 - y0;
            const inset = 1.8 * S;
            const dx0 = x0 - ext;
            const dy0 = y0 + inset;

            const df = ctx.createLinearGradient(0, dy0, 0, y1);
            df.addColorStop(0, '#d8bb8a');
            df.addColorStop(1, '#9b7a4c');
            ctx.fillStyle = df;
            ctx.fillRect(dx0, dy0, ext + 2, y1 - dy0);
            ctx.fillStyle = 'rgba(255,240,210,0.35)';
            ctx.fillRect(dx0, dy0, ext, 1 * S);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(dx0, dy0, 1 * S, y1 - dy0);

            const back = dy0 - d + inset;
            ctx.fillStyle = '#3a2717';
            quad([
                [dx0, dy0],
                [x0 + 2, dy0],
                [x0 + 2 + sk, back],
                [dx0 + sk, back]
            ]);
            ctx.fill();
            ctx.fillStyle = '#c9a877';
            quad([
                [dx0, dy0],
                [dx0 + 2.4 * S, dy0],
                [dx0 + sk + 2.4 * S, back],
                [dx0 + sk, back]
            ]);
            ctx.fill();
            ctx.fillStyle = '#b39264';
            quad([
                [dx0 + sk, back],
                [x0 + 2 + sk, back],
                [x0 + 2 + sk, back + 2 * S],
                [dx0 + sk, back + 2 * S]
            ]);
            ctx.fill();

            const heads = box.heads.slice().reverse();
            for (const h of heads) {
                const hx = dx0 + 7 * S + sk * h.v + h.j * S;
                const hy = dy0 - (d - inset) * h.v - 1.2 * S;
                ctx.strokeStyle = '#d9b884';
                ctx.lineWidth = 2.6 * S;
                ctx.lineCap = 'butt';
                ctx.beginPath();
                ctx.moveTo(hx, hy);
                ctx.lineTo(x0 + sk * h.v + 4, hy);
                ctx.stroke();
                const col = mix([150, 32, 24], [190, 52, 36], h.c);
                const hg = ctx.createRadialGradient(hx - 1.4 * S, hy - 1.2 * S, 0, hx, hy, 5 * S);
                hg.addColorStop(0, rgba(mix(col, [255, 170, 140], 0.5), 1));
                hg.addColorStop(0.5, rgba(col, 1));
                hg.addColorStop(1, rgba(mix(col, [40, 8, 6], 0.6), 1));
                ctx.fillStyle = hg;
                ctx.beginPath();
                ctx.ellipse(hx, hy, 4.6 * S, 3.3 * S, -0.15, 0, TAU);
                ctx.fill();
            }

            const topFace = [
                [x0, y0],
                [x1, y0],
                [x1 + sk, y0 - d],
                [x0 + sk, y0 - d]
            ];
            const tg = ctx.createLinearGradient(x0, y0 - d, x1, y0);
            tg.addColorStop(0, '#d7bc8d');
            tg.addColorStop(1, '#b89868');
            ctx.fillStyle = tg;
            quad(topFace);
            ctx.fill();

            ctx.save();
            ctx.transform(1, 0, sk / d, -1, x0, y0);
            const bw = x1 - x0;
            const lg = ctx.createLinearGradient(0, 0, bw, d);
            lg.addColorStop(0, '#b63a2c');
            lg.addColorStop(1, '#7e2219');
            ctx.fillStyle = lg;
            ctx.fillRect(bw * 0.05, d * 0.1, bw * 0.9, d * 0.8);
            ctx.strokeStyle = 'rgba(245,226,190,0.85)';
            ctx.lineWidth = 1 * S;
            ctx.strokeRect(bw * 0.08, d * 0.18, bw * 0.84, d * 0.64);
            ctx.fillStyle = '#f0e0bc';
            ctx.beginPath();
            ctx.ellipse(bw * 0.5, d * 0.5, d * 0.26 * 1.25, d * 0.26, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = '#c23b26';
            ctx.beginPath();
            ctx.moveTo(bw * 0.5, d * 0.73);
            ctx.bezierCurveTo(bw * 0.5 + d * 0.2, d * 0.5, bw * 0.5 + d * 0.14, d * 0.34, bw * 0.5, d * 0.32);
            ctx.bezierCurveTo(bw * 0.5 - d * 0.14, d * 0.34, bw * 0.5 - d * 0.2, d * 0.5, bw * 0.5, d * 0.73);
            ctx.fill();
            ctx.fillStyle = '#f3c98f';
            ctx.beginPath();
            ctx.ellipse(bw * 0.5, d * 0.44, d * 0.05, d * 0.08, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = 'rgba(245,226,190,0.8)';
            for (const side of [-1, 1]) {
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(bw * 0.5 + side * (d * 0.48 + i * bw * 0.07) - (side < 0 ? bw * 0.05 : 0), d * 0.47, bw * 0.05, d * 0.06);
                }
            }
            ctx.restore();
            ctx.strokeStyle = 'rgba(255,240,210,0.35)';
            ctx.lineWidth = 0.8 * S;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y0);
            ctx.stroke();

            const endFace = [
                [x1, y0],
                [x1, y1],
                [x1 + sk, y1 - d],
                [x1 + sk, y0 - d]
            ];
            ctx.fillStyle = '#6e4a2a';
            quad(endFace);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            quad([
                [x1, y0],
                [x1, y1],
                [x1 + sk * 0.35, y1 - d * 0.35],
                [x1 + sk * 0.35, y0 - d * 0.35]
            ]);
            ctx.fill();

            const sg = ctx.createLinearGradient(0, y0, 0, y1);
            sg.addColorStop(0, '#5c3524');
            sg.addColorStop(1, '#3a2016');
            ctx.fillStyle = sg;
            ctx.fillRect(x0, y0, bw, fh);
            ctx.save();
            ctx.beginPath();
            ctx.rect(x0, y0, bw, fh);
            ctx.clip();
            for (const gr of box.grain) {
                ctx.fillStyle = gr.l < 0.55 ? 'rgba(18,8,4,0.55)' : 'rgba(160,110,80,0.32)';
                ctx.fillRect(x0 + gr.u * bw, y0 + gr.v * fh, gr.r * S, gr.r * S);
            }
            ctx.lineCap = 'round';
            for (const s of box.streaks) {
                ctx.strokeStyle = `rgba(14,8,5,${s.a})`;
                ctx.lineWidth = 2.4 * S;
                ctx.beginPath();
                ctx.moveTo(x0 + s.u0 * bw, y0 + s.v0 * fh);
                ctx.lineTo(x0 + s.u1 * bw, y0 + s.v1 * fh);
                ctx.stroke();
                ctx.strokeStyle = `rgba(170,150,130,${s.a * 0.35})`;
                ctx.lineWidth = 0.8 * S;
                ctx.stroke();
            }
            ctx.restore();
            ctx.fillStyle = 'rgba(255,220,180,0.14)';
            ctx.fillRect(x0, y0, bw, 1 * S);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(x0, y1 - 1 * S, bw, 1 * S);
            ctx.restore();
        }

        function jag(x, dirSign, th) {
            ctx.beginPath();
            ctx.moveTo(x, -th / 2);
            ctx.lineTo(x + dirSign * 2.2 * S, -th * 0.2);
            ctx.lineTo(x + dirSign * 0.6 * S, 0);
            ctx.lineTo(x + dirSign * 2.8 * S, th * 0.3);
            ctx.lineTo(x, th / 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawMatch(m) {
            const mid = (m.s0 + m.s1) / 2;
            const lx = (s) => (s - mid) * S;
            const th = 3.6 * S;
            const front = frontS(m);
            const charred = m.state !== 'unlit';
            ctx.save();
            ctx.globalAlpha = clamp(m.life, 0, 1);
            ctx.translate(m.x, m.y);
            ctx.rotate(m.a);
            const xs = lx(Math.max(front, m.s0));
            const xe = lx(m.s1);
            if (xe > xs) {
                const wg = ctx.createLinearGradient(0, -th / 2, 0, th / 2);
                wg.addColorStop(0, '#f2dcae');
                wg.addColorStop(0.5, '#d8b47c');
                wg.addColorStop(1, '#94703f');
                ctx.fillStyle = wg;
                ctx.fillRect(xs, -th / 2, xe - xs, th);
                if (m.s1 < ML) {
                    jag(xe, 1, th);
                }
                if (!m.head && m.s0 > 0 && front <= m.s0) {
                    jag(xs, -1, th);
                }
                if (charred && front > m.s0) {
                    const eg = ctx.createLinearGradient(xs, 0, xs + 7 * S, 0);
                    eg.addColorStop(0, 'rgba(40,24,14,0.9)');
                    eg.addColorStop(1, 'rgba(120,80,40,0)');
                    ctx.fillStyle = eg;
                    ctx.fillRect(xs, -th / 2, 7 * S, th);
                }
            }
            if (charred && m.head) {
                const pts = charPath(m, lx);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#26201c';
                ctx.lineWidth = th * 0.78;
                ctx.beginPath();
                pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
                ctx.stroke();
                ctx.strokeStyle = 'rgba(150,140,130,0.3)';
                ctx.lineWidth = 0.6 * S;
                ctx.beginPath();
                pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y - th * 0.2) : ctx.moveTo(x, y - th * 0.2)));
                ctx.stroke();
                const [hx, hy, ha] = pts.end;
                ctx.fillStyle = '#211b18';
                ctx.beginPath();
                ctx.ellipse(hx, hy, 4.4 * S, 3.3 * S, ha, 0, TAU);
                ctx.fill();
                ctx.fillStyle = 'rgba(170,160,150,0.28)';
                ctx.beginPath();
                ctx.ellipse(hx - 0.8 * S, hy - 1 * S, 2.2 * S, 1.2 * S, ha, 0, TAU);
                ctx.fill();
            } else if (m.head) {
                const hx = lx(2.6);
                const hg = ctx.createRadialGradient(hx - 1.4 * S, -1.3 * S, 0, hx, 0, 5.2 * S);
                hg.addColorStop(0, '#f0907a');
                hg.addColorStop(0.45, '#b8321f');
                hg.addColorStop(1, '#5e140c');
                ctx.fillStyle = hg;
                ctx.beginPath();
                ctx.ellipse(hx, 0, 5.6 * S, 3.9 * S, 0, 0, TAU);
                ctx.fill();
            }
            ctx.restore();
        }

        function charPath(m, lx) {
            const front = Math.max(frontS(m), HEAD_S);
            const sign = Math.cos(m.a) >= 0 ? 1 : -1;
            const pts = [];
            let x = lx(front);
            let y = 0;
            let ang = Math.PI;
            const total = (front - m.s0) * S * 0.94;
            const n = Math.max(2, Math.ceil(total / (2 * S)));
            const ds = total / n;
            pts.push([x, y]);
            for (let i = 1; i <= n; i++) {
                const dist = i * ds;
                ang += sign * 0.0011 * (dist / S) * (ds / S);
                x += Math.cos(ang) * ds;
                y += Math.sin(ang) * ds;
                pts.push([x, y]);
            }
            pts.end = [x, y, ang - Math.PI];
            return pts;
        }

        function drawBits() {
            for (const p of sparks) {
                if (p.kind !== 'wood') {
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = clamp(p.life / 0.3, 0, 1);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.a);
                ctx.fillStyle = '#d8b47c';
                ctx.fillRect(-2 * S, -0.6 * S, 4 * S, 1.2 * S);
                ctx.restore();
            }
        }

        /* ---------- rendering: light ---------- */

        function lightsList() {
            const out = [];
            if (candle.lit || candle.dying > 0) {
                const fb = flameBase();
                const I = candle.lit ? candle.I * candle.flick : candle.dying / 0.16 * 0.5;
                out.push({
                    x: fb.x + candle.lx * 12 * S,
                    y: fb.y - 18 * S,
                    r: 760 * S * (0.5 + 0.5 * clamp(I, 0, 1.2)),
                    a: clamp(0.3 + 0.68 * I, 0, 0.98),
                    self: 'candle'
                });
            }
            for (const m of matches) {
                if (!burning(m)) {
                    continue;
                }
                const f = flamePos(m);
                const fk = flareK(m);
                out.push({
                    x: f.x,
                    y: f.y - 6 * S,
                    r: (420 * m.fl + 560 * fk) * S,
                    a: clamp(0.85 * m.fl + 0.3 * fk, 0, 0.97),
                    self: null
                });
            }
            return out;
        }

        function occluders() {
            const r = candle.w / 2;
            const top = candleTop() - candle.w * 0.15;
            const bottom = candle.baseY;
            return [{
                    id: 'candle',
                    pts: [
                        [candle.x - r, top],
                        [candle.x + r, top],
                        [candle.x + r, bottom],
                        [candle.x - r, bottom]
                    ]
                },
                {
                    id: 'box',
                    pts: boxPoly()
                },
            ];
        }

        function shadowPoly(pts, l) {
            const hl = Math.max(surfaceY - l.y, 4 * S);
            const proj = pts.map(([x, y]) => {
                const h = Math.max(0, surfaceY - y);
                const k = Math.min(5, hl / Math.max(hl - h, hl * 0.2));
                return [l.x + (x - l.x) * k, surfaceY - h * 0.18 * Math.min(1, k * 0.5)];
            });
            const all = pts.concat(proj);
            all.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
            const lower = [];
            for (const p of all) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
                    lower.pop();
                }
                lower.push(p);
            }
            const upper = [];
            for (let i = all.length - 1; i >= 0; i--) {
                const p = all[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
                    upper.pop();
                }
                upper.push(p);
            }
            return lower.slice(0, -1).concat(upper.slice(0, -1)).map(([x, y]) => [x, Math.min(y, surfaceY + 4 * S)]);
        }

        function lightGradient(c, l) {
            const g = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
            g.addColorStop(0, `rgba(255,206,146,${l.a})`);
            g.addColorStop(0.12, `rgba(255,200,138,${l.a * 0.9})`);
            g.addColorStop(0.35, `rgba(255,186,120,${l.a * 0.58})`);
            g.addColorStop(0.65, `rgba(255,170,100,${l.a * 0.24})`);
            g.addColorStop(1, 'rgba(255,160,90,0)');
            return g;
        }

        function renderLight() {
            const lights = lightsList();
            gctx.setTransform(1, 0, 0, 1, 0, 0);
            gctx.globalCompositeOperation = 'source-over';
            gctx.clearRect(0, 0, glow.width, glow.height);
            const occ = occluders();
            for (const l of lights) {
                tctx.setTransform(1, 0, 0, 1, 0, 0);
                tctx.globalCompositeOperation = 'source-over';
                tctx.clearRect(0, 0, lamp.width, lamp.height);
                tctx.setTransform(LIGHT_SCALE, 0, 0, LIGHT_SCALE, 0, 0);
                const g = lightGradient(tctx, l);
                tctx.fillStyle = g;
                tctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
                for (const o of occ) {
                    if (o.id === l.self) {
                        continue;
                    }
                    const cx = o.pts.reduce((s, p) => s + p[0], 0) / o.pts.length;
                    const cy = o.pts.reduce((s, p) => s + p[1], 0) / o.pts.length;
                    if (Math.hypot(cx - l.x, cy - l.y) > l.r) {
                        continue;
                    }
                    tctx.globalCompositeOperation = 'destination-out';
                    tctx.filter = 'blur(2px)';
                    tctx.fillStyle = 'rgba(0,0,0,0.7)';
                    tctx.beginPath();
                    shadowPoly(o.pts, l).forEach(([x, y], i) => (i ? tctx.lineTo(x, y) : tctx.moveTo(x, y)));
                    tctx.closePath();
                    tctx.fill();
                    tctx.filter = 'none';
                    tctx.globalCompositeOperation = 'source-over';
                    tctx.save();
                    tctx.beginPath();
                    o.pts.forEach(([x, y], i) => (i ? tctx.lineTo(x, y) : tctx.moveTo(x, y)));
                    tctx.closePath();
                    tctx.clip();
                    tctx.clearRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
                    tctx.fillStyle = g;
                    tctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
                    tctx.restore();
                }
                gctx.globalCompositeOperation = 'lighter';
                gctx.drawImage(lamp, 0, 0);
            }
            gctx.globalCompositeOperation = 'source-in';
            gctx.fillStyle = 'rgb(255,172,96)';
            gctx.fillRect(0, 0, glow.width, glow.height);
            gctx.globalCompositeOperation = 'source-over';

            dctx.setTransform(1, 0, 0, 1, 0, 0);
            dctx.globalCompositeOperation = 'source-over';
            dctx.clearRect(0, 0, dark.width, dark.height);
            dctx.fillStyle = `rgba(3,4,5,${AMBIENT})`;
            dctx.fillRect(0, 0, dark.width, dark.height);
            if (lights.length) {
                dctx.globalCompositeOperation = 'destination-out';
                dctx.drawImage(glow, 0, 0);
                dctx.globalCompositeOperation = 'source-over';
            }
            ctx.drawImage(dark, 0, 0, W, H);
            if (lights.length) {
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.22;
                ctx.drawImage(glow, 0, 0, W, H);
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        /* ---------- rendering: fire ---------- */

        function spine(x, y, L, lx, ly, seed, wob) {
            const pts = [];
            for (let i = 0; i <= 18; i++) {
                const t = i / 18;
                const w1 = Math.sin(time * 9.3 + seed - t * 5) * 0.045 + Math.sin(time * 17.1 + seed * 2 - t * 9) * 0.025;
                pts.push({
                    x: x + L * (lx * Math.pow(t, 1.7) + w1 * wob * t * t),
                    y: y - L * t + L * ly * t * t,
                    t
                });
            }
            return pts;
        }

        function flamePath(pts, wd) {
            const left = [];
            const right = [];
            const n = pts.length - 1;
            for (let i = 0; i <= n; i++) {
                const a = pts[Math.max(0, i - 1)];
                const b = pts[Math.min(n, i + 1)];
                const tx = b.x - a.x;
                const ty = b.y - a.y;
                const tl = Math.hypot(tx, ty) || 1;
                const nx = -ty / tl;
                const ny = tx / tl;
                const u = (pts[i].t + 0.07) / 1.07;
                const hw = wd * Math.sin(Math.PI * Math.pow(u, 0.62));
                left.push([pts[i].x + nx * hw, pts[i].y + ny * hw]);
                right.push([pts[i].x - nx * hw, pts[i].y - ny * hw]);
            }
            const p = new Path2D();
            p.moveTo(left[0][0], left[0][1]);
            for (let i = 1; i <= n; i++) {
                p.lineTo(left[i][0], left[i][1]);
            }
            for (let i = n - 1; i >= 0; i--) {
                p.lineTo(right[i][0], right[i][1]);
            }
            const b0 = pts[0];
            const b1 = pts[1];
            const bl = Math.hypot(b1.x - b0.x, b1.y - b0.y) || 1;
            p.quadraticCurveTo(b0.x - ((b1.x - b0.x) / bl) * wd * 1.1, b0.y - ((b1.y - b0.y) / bl) * wd * 1.1, left[0][0], left[0][1]);
            p.closePath();
            return p;
        }

        function drawFlame(x, y, L, wd, lx, ly, I, seed, wob, blue) {
            if (I <= 0.01 || L < 1) {
                return;
            }
            const lean = Math.min(1.5, Math.hypot(lx, ly));
            L *= 1 + lean * 0.15;
            wd *= 1 - lean * 0.2;
            const pts = spine(x, y, L, lx, ly, seed, wob);
            const mid = pts[6];
            const tip = pts[pts.length - 1];
            ctx.globalCompositeOperation = 'lighter';
            const hr = L * 2.2;
            const halo = ctx.createRadialGradient(mid.x, mid.y, 0, mid.x, mid.y, hr);
            halo.addColorStop(0, `rgba(255,160,70,${0.26 * I})`);
            halo.addColorStop(0.4, `rgba(255,130,50,${0.08 * I})`);
            halo.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = halo;
            ctx.fillRect(mid.x - hr, mid.y - hr, hr * 2, hr * 2);

            ctx.fillStyle = `rgba(255,110,35,${0.18 * I})`;
            ctx.fill(flamePath(spine(x, y + wd * 0.2, L * 1.1, lx, ly, seed, wob), wd * 1.45));

            const body = ctx.createLinearGradient(x, y, tip.x, tip.y);
            body.addColorStop(0, `rgba(60,90,255,${0.3 + 0.4 * blue})`);
            body.addColorStop(0.13, `rgba(110,100,230,${0.25 + 0.2 * blue})`);
            body.addColorStop(0.26, `rgba(255,140,45,${0.72 * I})`);
            body.addColorStop(0.5, `rgba(255,186,92,${0.92 * I})`);
            body.addColorStop(0.8, `rgba(255,150,55,${0.66 * I})`);
            body.addColorStop(1, 'rgba(255,90,30,0)');
            ctx.shadowColor = `rgba(255,140,50,${0.7 * I})`;
            ctx.shadowBlur = 10 * S * VIEW * DPR;
            ctx.fillStyle = body;
            ctx.fill(flamePath(pts, wd));
            ctx.shadowBlur = 0;

            const cp = spine(x, y - L * 0.08, L * 0.72, lx * 0.9, ly * 0.9, seed, wob * 0.8);
            const ct = cp[cp.length - 1];
            const core = ctx.createLinearGradient(x, y - L * 0.08, ct.x, ct.y);
            core.addColorStop(0, `rgba(255,200,140,${0.1 * I})`);
            core.addColorStop(0.25, `rgba(255,244,218,${0.9 * I})`);
            core.addColorStop(1, 'rgba(255,220,160,0)');
            ctx.fillStyle = core;
            ctx.fill(flamePath(cp, wd * 0.58));

            const hp = spine(x, y - L * 0.16, L * 0.42, lx * 0.8, ly * 0.8, seed, wob * 0.6);
            ctx.fillStyle = `rgba(255,255,248,${0.55 * I})`;
            ctx.fill(flamePath(hp, wd * 0.3));

            ctx.fillStyle = `rgba(70,110,255,${0.22 + 0.25 * blue})`;
            ctx.beginPath();
            ctx.ellipse(x, y - wd * 0.1, wd * 0.8, wd * 0.45, 0, 0, TAU);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawCandleFlame() {
            if (!candle.lit && candle.dying <= 0) {
                return;
            }
            const fb = flameBase();
            let I = candle.I;
            let lx = candle.lx;
            let ly = candle.ly;
            let y = fb.y;
            if (!candle.lit) {
                const k = candle.dying / 0.16;
                I = 0.6 * k;
                lx = candle.lx + Math.sign(air.x || 1) * (1 - k) * 2;
                y -= (1 - k) * 14 * S;
            }
            const L = 60 * S * (0.3 + 0.7 * I) * candle.flick;
            const wd = 9.6 * S * (0.55 + 0.45 * I);
            drawFlame(fb.x, y, L, wd, lx, ly, clamp(I * 1.1, 0, 1), 0.7, 1 + candle.gut * 4, clamp(1 - I + candle.gut, 0, 1));
            if (candle.lit) {
                drawWick(0.75);
                ctx.globalCompositeOperation = 'lighter';
                const t = wickTip();
                const eg = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 3 * S);
                eg.addColorStop(0, 'rgba(255,170,80,0.9)');
                eg.addColorStop(1, 'rgba(255,90,20,0)');
                ctx.fillStyle = eg;
                ctx.fillRect(t.x - 3 * S, t.y - 3 * S, 6 * S, 6 * S);
                ctx.globalCompositeOperation = 'source-over';
