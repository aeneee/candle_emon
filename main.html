            }
        }

        function drawWaxGlow() {
            if (candle.I <= 0.01) {
                return;
            }
            const x = candle.x;
            const r = candle.w / 2;
            const ry = candle.w * 0.15;
            const top = candleTop();
            const bottom = candle.baseY - 4 * S;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x - r, top);
            ctx.lineTo(x - r, bottom);
            ctx.ellipse(x, bottom, r, ry, 0, Math.PI, 0, true);
            ctx.lineTo(x + r, top);
            ctx.ellipse(x, top, r, ry, 0, 0, TAU, true);
            ctx.clip();
            ctx.globalCompositeOperation = 'lighter';
            const I = candle.I * candle.flick;
            const g = ctx.createRadialGradient(x, top, 0, x, top, 80 * S);
            g.addColorStop(0, `rgba(255,170,90,${0.5 * I})`);
            g.addColorStop(0.4, `rgba(255,140,60,${0.18 * I})`);
            g.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = g;
            ctx.fillRect(x - r, top - ry, r * 2, 90 * S);
            ctx.restore();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawMatchFire(m) {
            if (m.ember > 0 || burning(m)) {
                const s = Math.max(frontS(m), m.s0);
                const f = mpos(m, s);
                const e = burning(m) ? 1 : m.ember;
                ctx.globalCompositeOperation = 'lighter';
                const r = 5 * S;
                const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
                g.addColorStop(0, `rgba(255,150,60,${0.9 * e * (0.8 + 0.2 * Math.sin(time * 30 + m.age))})`);
                g.addColorStop(1, 'rgba(255,60,10,0)');
                ctx.fillStyle = g;
                ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
                ctx.globalCompositeOperation = 'source-over';
            }
            if (!burning(m)) {
                return;
            }
            const f = flamePos(m);
            const fk = flareK(m);
            if (fk > 0) {
                ctx.globalCompositeOperation = 'lighter';
                const hr = 90 * S * (0.4 + fk);
                const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, hr);
                g.addColorStop(0, `rgba(255,250,230,${0.9 * fk})`);
                g.addColorStop(0.12, `rgba(255,220,150,${0.6 * fk})`);
                g.addColorStop(0.4, `rgba(255,150,60,${0.2 * fk})`);
                g.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.fillStyle = g;
                ctx.fillRect(f.x - hr, f.y - hr, hr * 2, hr * 2);
                ctx.globalCompositeOperation = 'source-over';
            }
            const L = (20 + 22 * fk) * S * m.fl;
            const wd = (5 + 5 * fk) * S * (0.6 + 0.4 * m.fl);
            drawFlame(f.x, f.y + 2 * S, L, wd, m.lx, m.ly, clamp(m.fl + fk, 0, 1), m.age * 3 + 1.3, 1.2, m.state === 'flare' ? 0.2 : 0.5);
        }

        function drawSparks() {
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            for (const p of sparks) {
                if (p.kind !== 'fire') {
                    continue;
                }
                const t = clamp(p.life / p.max, 0, 1);
                ctx.strokeStyle = `rgba(255,${Math.round(150 + 100 * t)},${Math.round(60 + 140 * t * t)},${t})`;
                ctx.lineWidth = 1.3 * S;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.vx * 0.014, p.y - p.vy * 0.014);
                ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSmoke() {
            const lit = candle.lit ? 0.55 + 0.45 * candle.I : 0.5;
            for (const s of smoke) {
                const pts = s.pts;
                const n = pts.length;
                if (n < 2) {
                    continue;
                }
                const L = [];
                const R = [];
                const A = [];
                for (let i = 0; i < n; i++) {
                    const p = pts[i];
                    const a = pts[Math.max(0, i - 1)];
                    const b = pts[Math.min(n - 1, i + 1)];
                    const tx = b.x - a.x;
                    const ty = b.y - a.y;
                    const tl = Math.hypot(tx, ty) || 1;
                    const hw = ((s.puff ? 4 + p.age * 16 : 0.8 + p.age * 3.4) * S) / 2;
                    L.push([p.x - (ty / tl) * hw, p.y + (tx / tl) * hw]);
                    R.push([p.x + (ty / tl) * hw, p.y - (tx / tl) * hw]);
                    const f = 1 - p.age / p.life;
                    A.push(s.str * p.a * (s.puff ? 0.2 : 0.45) * Math.pow(Math.max(0, f), 1.4) * smooth(0, 0.3, p.age) * lit);
                }
                const CH = 5;
                for (let i = 0; i < n - 1; i += CH) {
                    const end = Math.min(n - 1, i + CH);
                    const a = A[Math.min(n - 1, i + (CH >> 1))];
                    if (a < 0.004) {
                        continue;
                    }
                    ctx.fillStyle = `rgba(200,196,190,${a})`;
                    ctx.beginPath();
                    ctx.moveTo(L[i][0], L[i][1]);
                    for (let j = i + 1; j <= end; j++) {
                        ctx.lineTo(L[j][0], L[j][1]);
                    }
                    for (let j = end; j >= i; j--) {
                        ctx.lineTo(R[j][0], R[j][1]);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        function drawEmber() {
            if (candle.ember <= 0 || candle.lit) {
                return;
            }
            const t = wickTip();
            const e = candle.ember * (0.75 + 0.25 * Math.sin(time * 23));
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 6 * S);
            g.addColorStop(0, `rgba(255,150,60,${e})`);
            g.addColorStop(0.3, `rgba(255,90,30,${e * 0.5})`);
            g.addColorStop(1, 'rgba(255,60,10,0)');
            ctx.fillStyle = g;
            ctx.fillRect(t.x - 6 * S, t.y - 6 * S, 12 * S, 12 * S);
            ctx.globalCompositeOperation = 'source-over';
        }

        function render() {
            ctx.setTransform(DPR * VIEW, 0, 0, DPR * VIEW, 0, 0);
            ctx.clearRect(0, 0, W, H);
            drawContactShadows();
            drawCandle();
            drawBox();
            for (const m of matches) {
                if (!m.held) {
                    drawMatch(m);
                }
            }
            drawBits();
            if (grab) {
                drawMatch(grab.m);
            }
            renderLight();
            drawWaxGlow();
            drawSmoke();
            drawEmber();
            drawCandleFlame();
            for (const m of matches) {
                drawMatchFire(m);
            }
            drawSparks();
        }

        /* ---------- loop ---------- */

        let last = performance.now();
        let accT = 0;

        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            accT += dt;
            while (accT >= STEP) {
                step(STEP);
                accT -= STEP;
            }
            updateWorld(dt);
            render();
            requestAnimationFrame(frame);
        }

        resize();
        syncUI();
        requestAnimationFrame(frame);
    </script>
